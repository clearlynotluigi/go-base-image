version: '3'

includes:
  local:
    taskfile: ./.local/Taskfile.yml
    dir: .
    optional: true

vars:
  ENGINE: podman
  IMAGE:
    sh: yq '.image' image.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list-all

  build:*:
    desc: "Local native smoke-test build, e.g. task build:1.x.x"
    vars:
      TAG: '{{index .MATCH 0}}'
      GO_VERSION: '{{first (splitList "-" .TAG)}}'
      BUILD_ARGS:
        sh: yq '.args | to_entries | map("--build-arg " + .key + "=" + .value) | join(" ")' image.yml
    cmds:
      - '{{.ENGINE}} build -t {{.IMAGE}}:{{.TAG}}-local {{.BUILD_ARGS}} --build-arg GO_VERSION={{.GO_VERSION}} {{.CLI_ARGS}} .'

  rebuild:*:*:
    desc: "Rebuild from any past commit SHA, e.g. task rebuild:a1b2c3d:1.x.x"
    vars:
      REV: '{{index .MATCH 0}}'
      IMG_TAG: '{{index .MATCH 1}}'
    cmds:
      - |
        set -e
        dir=$(mktemp -d)
        trap 'git worktree remove --force "$dir" 2>/dev/null || true' EXIT
        git worktree add --detach "$dir" "{{.REV}}"
        cd "$dir"
        task build:{{.IMG_TAG}}
