version: '3'

includes:
  local:
    taskfile: ./.local/Taskfile.yml
    dir: .
    optional: true

vars:
  ENGINE: podman
  # override for a quick native build: task build:1.27 PLATFORMS=linux/arm64
  PLATFORMS: linux/amd64,linux/arm64
  IMAGE:
    sh: yq '.image' image.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list-all

  build:*:
    desc: "Build the image, e.g. task build:1.27 (the Go version is also the image tag). Extra build flags go after --"
    vars:
      VERSION: '{{index .MATCH 0}}'
      # every key under args becomes --build-arg KEY=value
      BUILD_ARGS:
        sh: yq '.args | to_entries | map("--build-arg " + .key + "=" + .value) | join(" ")' image.yml
    cmds:
      - '{{.ENGINE}} manifest rm --ignore {{.IMAGE}}:{{.VERSION}}'
      - '{{.ENGINE}} build --platform {{.PLATFORMS}} --manifest {{.IMAGE}}:{{.VERSION}} {{.BUILD_ARGS}} --build-arg GO_VERSION={{.VERSION}} {{.CLI_ARGS}} .'

  tag:*:
    desc: "Create the git tag for a release and push it to origin, e.g. task tag:1.27"
    vars:
      TAG: '{{index .MATCH 0}}'
    preconditions:
      - sh: '[ -z "$(git status --porcelain -- Dockerfile image.yml)" ]'
        msg: "Dockerfile or image.yml has uncommitted changes: commit first, the tag has to point at the recipe it names."
      - sh: '! git ls-remote --exit-code --tags origin "refs/tags/{{.TAG}}" > /dev/null 2>&1'
        msg: "Tag '{{.TAG}}' already exists on origin. Tags are never moved: pick a new tag name."
    cmds:
      # no -f anywhere, tags are never moved. A tag already on origin is refused above; one that exists only
      # locally (an earlier push failed) is pushed as it is, so rerunning this task finishes the job.
      - |
        if git rev-parse -q --verify "refs/tags/{{.TAG}}" > /dev/null; then
          echo "Tag {{.TAG}} already exists locally at $(git rev-parse --short "{{.TAG}}^{commit}"): pushing it as it is"
        else
          git tag {{.TAG}}
        fi
        git push origin refs/tags/{{.TAG}} || {
          echo "Tag {{.TAG}} exists locally but was not pushed. Fix the remote, then run: git push origin refs/tags/{{.TAG}}" >&2
          exit 1
        }

  push:*:
    desc: "Push the built image to every registry, once its git tag is on origin, e.g. task push:1.27"
    vars:
      TAG: '{{index .MATCH 0}}'
      # image.yml, plus .local/registries.yml (git-ignored, same `registries:` list) when it exists
      REGISTRIES:
        sh: |
          if [ -f .local/registries.yml ]; then
            yq --no-doc '.registries[]' image.yml .local/registries.yml
          else
            yq --no-doc '.registries[]' image.yml
          fi
      # a perk: the registry also gets <tag>-YYMMDD, overwritten if pushed twice the same day
      STAMP:
        sh: date +%y%m%d
    preconditions:
      - sh: git ls-remote --exit-code --tags origin "refs/tags/{{.TAG}}" > /dev/null
        msg: "Git tag '{{.TAG}}' is not on origin (or origin is unreachable). Create it with `task tag:{{.TAG}}` if needed, then run: git push origin refs/tags/{{.TAG}}"
    cmds:
      - for: { var: REGISTRIES, split: "\n" }
        cmd: |
          for tag in {{.TAG}} {{.TAG}}-{{.STAMP}}; do
            {{.ENGINE}} manifest push --all {{.IMAGE}}:{{.TAG}} docker://{{.ITEM}}/{{.IMAGE}}:$tag
          done

  rebuild:*:
    desc: "Build from the past: check out an existing git tag in a temporary worktree and build there, e.g. task rebuild:1.26"
    vars:
      TAG: '{{index .MATCH 0}}'
    preconditions:
      - sh: git rev-parse -q --verify "refs/tags/{{.TAG}}" > /dev/null
        msg: "No git tag '{{.TAG}}'. See: git tag -l"
    cmds:
      - |
        set -e
        dir=$(mktemp -d)
        trap 'git worktree remove --force "$dir" 2>/dev/null || true' EXIT
        git worktree add --detach "$dir" refs/tags/{{.TAG}}
        cd "$dir"
        task build:{{.TAG}}
