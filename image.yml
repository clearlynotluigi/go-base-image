# The image config: everything the build needs besides the Go version, which comes from the tag (task build:<tag>).
# Keys under `args` are passed to the build as --build-arg, so they match the Dockerfile ARG names.

image: go-base

registries:
  - docker.io/mariort

args:
  GOLANG_MIGRATE_VERSION: v4.20.1
  GOLANGCI_LINT_VERSION: v2.15.0
  GOSEC_VERSION: v2.30.0
  GO_DELVE_VERSION: v1.27.2
  TASK_VERSION: v3.54.0
