# Keys under a version's `args` are passed to the build as --build-arg, so they match the Dockerfile ARG names.
# A frozen version holds only `ref`: its recipe is read from that git tag (see `task freeze:<version>`).

image: go-base

registries:
  - docker.io/mariort

versions:
  "1.27":
    args:
      GOLANGCI_LINT_VERSION: v2.15.0
      GOSEC_VERSION: v2.30.0
      GO_DELVE_VERSION: v1.27.2
      TASK_VERSION: v3.54.0

  "1.26":
    args:
      GOLANGCI_LINT_VERSION: v2.15.0
      GOSEC_VERSION: v2.30.0
      GO_DELVE_VERSION: v1.27.2
      TASK_VERSION: v3.54.0
